name: Build JDCloud BE6500 (ipq53xx / qualcommbe)

# 编译 LEDE fork: https://github.com/Qianzf/LEDE-JDCloud-BE6500
# 产物: openwrt-qualcommbe-ipq53xx-jdcloud_re-cs-06-squashfs-{sysupgrade,factory}.bin
#
# 触发方式:
#   1. Actions 页面手动 Run workflow（可指定源仓库分支 / 配置文件）
#   2. 本仓库 config/ overlay/ 或工作流本身有改动时
#   3. 每周定时一次

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源仓库 LEDE-JDCloud-BE6500 的分支或提交'
        type: string
        default: master
      config_file:
        description: '配置文件（config/ 目录下）'
        type: string
        default: config/jdcloud-be6500.config
      force_download:
        description: '忽略缓存，重新下载所有源码包'
        type: boolean
        default: false
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'overlay/**'
  schedule:
    - cron: '0 18 * * 5'   # 每周五 18:00 UTC（周六 02:00 CST）

# 同一分支只跑一个，新的排队不取消（编译很贵，不轻易丢）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPO: Qianzf/LEDE-JDCloud-BE6500
  TARGET_DIR: bin/targets/qualcommbe/ipq53xx
  # GitHub 免费 runner 是 4 核 / 16GB，-j5 比较稳
  BUILD_JOBS: '5'

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # GitHub 单个 job 上限 360 分钟

    steps:
      # ---------------------------------------------------------------- 环境
      - name: 释放磁盘空间
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm /usr/local/graalvm \
                      /usr/local/.ghcup /usr/share/miniconda || true
          sudo apt-get clean
          echo "=== after ==="; df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev libelf-dev \
            rsync unzip zlib1g-dev file wget curl ca-certificates \
            python3 python3-distutils python3-setuptools python3-pyelftools \
            bc time xxd vim-common subversion device-tree-compiler \
            swig texinfo
          # 老 forkkernel 需要的 svn（部分 feed 用），失败不影响
          df -h /

      # ---------------------------------------------------------------- 源码
      - name: 拉取源码（LEDE fork）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || 'master' }}
          path: source
          fetch-depth: 1

      - name: 拉取 CI 配置（本仓库）
        uses: actions/checkout@v4
        with:
          path: ci

      - name: 注入配置与 overlay
        run: |
          set -e
          CFG="${{ inputs.config_file || 'config/jdcloud-be6500.config' }}"
          echo "使用配置: $CFG"
          cp "ci/$CFG" source/.config

          # source/.gitignore 忽略了 files/ 与 env/，但它们是构建输入（默认中文、
          # 主题、kernel config），必须显式拷进去。
          mkdir -p source/files source/env
          rsync -a ci/overlay/files/ source/files/
          rsync -a ci/overlay/env/   source/env/

          echo "=== overlay 内容 ==="
          find source/files source/env -type f

          # 打开 ccache（编译缓存）。rules.mk:341 起把 TARGET_CC/HOSTCC 包上 ccache，
          # 默认目录 .ccache 在工作树根，正好被下面的 actions/cache 缓存。
          # rules.mk:346 默认 CCACHE_DIR = $(TOPDIR)/.ccache，不用显式指定
          grep -qx 'CONFIG_CCACHE=y' source/.config || echo 'CONFIG_CCACHE=y' >> source/.config

      - name: 缓存 dl（源码包）
        if: ${{ !inputs.force_download }}
        uses: actions/cache@v4
        with:
          # 不带 run_id：否则每次运行都新建一条缓存，10 GB 配额很快被顶穿。
          # 以「配置文件 + feeds 定义」为键，配置不变就一直复用同一条。
          path: source/dl
          key: dl-${{ hashFiles('ci/config/*.config', 'ci/overlay/**') }}-v1
          restore-keys: |
            dl-

      - name: 缓存 feeds（省 2~4 分钟 clone）
        uses: actions/cache@v4
        with:
          path: |
            source/feeds
            source/package/feeds
          key: feeds-${{ hashFiles('source/feeds.conf.default') }}-v1
          restore-keys: |
            feeds-

      # ---------------------------------------------------------------- 配置
      - name: feeds update / install + defconfig
        working-directory: source
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "=== 关键配置核对 ==="
          for k in \
            CONFIG_TARGET_qualcommbe=y \
            CONFIG_TARGET_qualcommbe_ipq53xx=y \
            CONFIG_TARGET_qualcommbe_ipq53xx_DEVICE_jdcloud_re-cs-06=y \
            CONFIG_PACKAGE_luci-theme-vantage=y \
            CONFIG_PACKAGE_luci-app-wolplus=y \
            CONFIG_PACKAGE_ATH_DEBUG=y
          do
            grep -qx "$k" .config && echo "OK   $k" || { echo "MISS $k"; exit 1; }
          done
          # 不应存在的：
          for k in CONFIG_PACKAGE_luci-app-wol=y; do
            grep -qx "$k" .config && { echo "UNEXPECTED $k"; exit 1; } || echo "OK   无 $k"
          done
          cp .config ../result.config
          grep -c '^CONFIG_PACKAGE_.*=y' .config | xargs echo "选中包数量:"

      # ---------------------------------------------------------------- 下载
      - name: 下载源码包
        working-directory: source
        run: |
          for i in 1 2 3; do
            echo "=== download 第 $i 轮 ==="
            make download -j8 && break
            echo "有包下载失败，重试…"
          done
          # 校验完整性（部分镜像源偶发截断）
          make download -j8 V=s 2>&1 | tail -20 || true
          du -sh dl

      # ---------------------------------------------------------------- 编译
      - name: 缓存 ccache（编译缓存）
        uses: actions/cache@v4
        with:
          path: source/.ccache
          key: ccache-${{ hashFiles('ci/config/*.config') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ hashFiles('ci/config/*.config') }}-
            ccache-
          # 说明：key 里带 run_id 是有意的 —— actions/cache 命中后不会再保存，
          # 不带 run_id 就永远只有第一次那份。上限靠 ccache --max-size=3G 控制，
          # 旧条目由 GitHub 按 LRU 淘汰（单仓库 10 GB）。

      - name: ccache 统计（缓存命中情况）
        working-directory: source
        run: |
          CC=$(ls staging_dir/host/bin/ccache 2>/dev/null || command -v ccache || true)
          if [ -n "$CC" ]; then
            CCACHE_DIR="$PWD/.ccache" "$CC" --max-size=3G
            CCACHE_DIR="$PWD/.ccache" "$CC" -s
          else
            echo "ccache 还没构建出来（tools 阶段会编），首轮无统计"
          fi

      - name: 编译
        working-directory: source
        env:
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: 'true'
          CCACHE_COMPRESSLEVEL: '6'
        run: |
          set -o pipefail
          make -j"${BUILD_JOBS}" V=w 2>&1 | tail -120

      - name: ccache 命中率
        if: always()
        working-directory: source
        run: |
          CC=staging_dir/host/bin/ccache
          [ -x "$CC" ] || CC=$(command -v ccache || true)
          if [ -n "$CC" ] && [ -x "$CC" ]; then
            CCACHE_DIR="$PWD/.ccache" "$CC" -s | tee /tmp/ccache.txt
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      # ---------------------------------------------------------------- 产物
      - name: 生成校验和与摘要
        if: always()
        run: |
          set -e
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          if [ -d "source/${TARGET_DIR}" ] && ls source/${TARGET_DIR}/*.bin >/dev/null 2>&1; then
            cd source/${TARGET_DIR}
            sha256sum *.bin | tee sha256sums.ci.txt
            ls -l *.bin | awk '{printf "%s\t%s B\n", $9, $5}' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat sha256sums.ci.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo ':x: 没有产出 bin 文件，看上面的编译日志' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdcloud-be6500-${{ github.run_number }}
          path: |
            source/bin/targets/qualcommbe/ipq53xx/*.bin
            source/bin/targets/qualcommbe/ipq53xx/*.itb
            source/bin/targets/qualcommbe/ipq53xx/sha256sums
            source/bin/targets/qualcommbe/ipq53xx/sha256sums.ci.txt
            source/bin/targets/qualcommbe/ipq53xx/*.manifest
            result.config
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: |
            source/logs/
            source/.config
          if-no-files-found: ignore
          retention-days: 7
